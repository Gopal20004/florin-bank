spring:
  application:
    name: florin
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/florin}
    username: ${DB_USER:florin}
    password: ${DB_PASSWORD:florin}
    hikari:
      # Size per instance: instances x pool size must stay below MySQL max_connections (151 by default).
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Instants are written as UTC DATETIME(6), whatever the JVM or MySQL session time zone is.
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP
        # Safety net for lazy associations the entity graphs do not cover: load them in batches of 50.
        default_batch_fetch_size: 50
  mvc:
    # Errors answer as RFC 9457 problem JSON ("detail" carries the message) rather than an empty body.
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  # Finish in-flight requests before exiting so a restart never cuts a transfer in half.
  shutdown: graceful
  # Trust X-Forwarded-* from the reverse proxy so rate limits see the real client address.
  forward-headers-strategy: native
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Redis is deliberately absent: sessions and rate limits degrade without it rather than going unready.
        readiness:
          include: readinessState,db

florin:
  allowed-origin: ${FLORIN_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
  # Business days, daily limits and statement dates follow the bank's clock, not the server's.
  zone: ${FLORIN_ZONE:Asia/Kolkata}
  currency: INR
  # IFSC-style branch code printed on account details. Every account belongs to this one branch.
  branch-code: FLRN0001001
  limits:
    # Deposits, withdrawals and payments to other customers; moving money between your own accounts is unlimited.
    per-transaction: 200000.00
    # Money leaving a customer's accounts (withdrawals and payments to others) per bank day.
    daily-outgoing: 500000.00
    max-accounts: 5
    max-payees: 50
  demo:
    # Seeds a demo customer with four months of history on startup (see demo/DemoData.java).
    seed: ${FLORIN_DEMO_SEED:false}
    email: demo@example.com
    password: florin-demo
  rate-limit:
    enabled: ${FLORIN_RATE_LIMIT_ENABLED:true}
    auth: { capacity: 10, per: 1m }
    money: { capacity: 20, per: 1m }
    lookup: { capacity: 20, per: 1m }
    write: { capacity: 60, per: 1m }
    read: { capacity: 600, per: 1m }
