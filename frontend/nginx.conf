# Behind a tunnel or load balancer every request arrives from one address, with the real client in
# CF-Connecting-IP / X-Forwarded-For. Prefer those so rate limits apply per customer, not per proxy.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Coarse per-address limit at the edge; the API applies finer per-customer limits behind it.
limit_req_zone $client_ip zone=api:10m rate=30r/s;

upstream backend {
    zone backend 64k;
    resolver 127.0.0.11 valid=10s;
    server backend:8080 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # Build output is content-hashed, so it can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # The session token lives in web storage, so a strict CSP is what stands between an injected
        # script and that token. Vite emits no inline scripts; styles need inline for Motion.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
